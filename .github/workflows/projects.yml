name: update starred projects

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/build-projects.mjs"
      - "assets/render-png.mjs"
      - ".github/workflows/projects.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: install
        run: npm install

      - name: build projects from stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          PROJECTS_LIMIT: "8"
        run: node assets/build-projects.mjs

      - name: render projects.png
        run: node assets/render-projects-png.mjs

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects.svg assets/projects.png
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh PROJECTS.LIST from starred repos"
            git push
          fi
