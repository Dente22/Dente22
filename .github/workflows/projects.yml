name: update starred projects

# Auto-refreshes PROJECTS.LIST from your OWN repos that you starred.
# Star  → card appears on next run
# Unstar → card disappears on next run
# (same idea as the contribution snake daily refresh)

on:
  schedule:
    # every 3 hours + once with the snake at midnight UTC
    - cron: "0 */3 * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/build-projects.mjs"
      - "assets/render-projects-png.mjs"
      - ".github/workflows/projects.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # no npm cache — package-lock is not committed

      - name: install
        run: npm install --no-fund --no-audit

      - name: build projects from own stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          PROJECTS_LIMIT: "8"
        run: node assets/build-projects.mjs

      - name: render projects.png
        run: node assets/render-projects-png.mjs

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects.svg assets/projects.png
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh PROJECTS.LIST from own starred repos"
            git push
          fi
